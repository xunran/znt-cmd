          type: integer
          format: int32
        retry_max:
          type: integer
          format: int32
        health_check_enabled:
          type: boolean
        metadata:
          type: object
          description: For http_api connections, metadata.openapi_path may be an absolute path such as /openapi.json; service connection test will fetch it under base_url and refresh http_operation resources.
