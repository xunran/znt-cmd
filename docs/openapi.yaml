      responses:
        "200":
          description: API key patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
    delete:
      tags: [ApiKeys]
      operationId: deleteApiKey
      summary: Revoke an API key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: API key revoked.

  /v1/api-keys/{api_key_id}/rotate:
    post:
      tags: [ApiKeys]
      operationId: rotateApiKey
      summary: Rotate an API key secret.
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: API key rotated. The secret is only returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"

  /v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List workspace members.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Member list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
    post:
      tags: [Members]
      operationId: inviteMember
      summary: Invite a workspace member.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInviteRequest"
      responses:
        "201":
          description: Member invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"

  /v1/members/{member_id}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    patch:
      tags: [Members]
      operationId: patchMember
      summary: Patch a member role or status.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPatchRequest"
      responses:
        "200":
          description: Member patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a workspace member.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Member removed.

  /v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get workspace governance and product settings.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    patch:
      tags: [Settings]
      operationId: patchSettings
      summary: Patch workspace governance and product settings.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatchRequest"
      responses:
        "200":
          description: Settings patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"

  /v1/eval-sets:
    get:
      tags: [Evals]
      operationId: listEvalSets
      summary: List evaluation sets.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Evaluation set list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalSetListResponse"
    post:
      tags: [Evals]
      operationId: createEvalSet
      summary: Create an evaluation set.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalSetUpsertRequest"
      responses:
        "201":
          description: Evaluation set created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalSetResponse"

  /v1/eval-sets/{eval_set_id}/runs:
    post:
      tags: [Evals]
      operationId: runEvalSet
      summary: Run an evaluation set against an agent version.
      parameters:
        - $ref: "#/components/parameters/EvalSetId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRunRequest"
      responses:
        "202":
          description: Evaluation run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunResponse"

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
    originSignature:
      type: apiKey
      in: header
      name: x-origin-agentops-signature
    originTimestamp:
      type: apiKey
      in: header
      name: x-origin-agentops-timestamp
    originClaims:
      type: apiKey
      in: header
      name: x-origin-agentops-claims

  parameters:
    RequestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
    TraceId:
      name: x-trace-id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
    ToolId:
      name: tool_id
      in: path
      required: true
      schema:
        type: string
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
    TracePathId:
      name: trace_id
      in: path
      required: true
      schema:
        type: string
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
    EvalSetId:
      name: eval_set_id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid service authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated caller is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict, usually idempotency or state transition related.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Quota or rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Meta:
      type: object
      required: [request_id, trace_id]
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        workspace_id:
          type: string
        tenant_id:
          type: string
      additionalProperties: true

    ListMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            next_cursor:
              type: string
              nullable: true

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"

    HealthResponse:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [ok, ready, degraded, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string

    VersionResponse:
      type: object
      required: [version, contract_version]
      properties:
        version:
          type: string
        contract_version:
          type: string
        build:
          type: string

    ResourceRef:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string

    Agent:
      type: object
