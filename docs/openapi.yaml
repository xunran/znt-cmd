openapi: 3.0.3
info:
  title: Origin Agent Platform Product API
  version: v1.0-alpha
  description: >
    Product-level API contract for Origin Agent Platform. The product owns this
    contract; server-side services implement it; PloyKit modules consume it.

x-origin-contract:
  role: product-api-contract
  owner: origin-product
  consumers:
    - ploykit-origin-agentops
  implementedBy:
    - server-side-services
  sourceOfTruth: true

servers:
  - url: https://api.origin.example
    description: Production API endpoint.
  - url: http://127.0.0.1:8080
    description: Local implementation endpoint.
  - url: http://127.0.0.1:4010
    description: Local contract/mock endpoint.

security:
  - serviceToken: []
    originSignature: []
    originTimestamp: []
    originClaims: []

tags:
  - name: System
  - name: Dashboard
  - name: Search
  - name: Notifications
  - name: Commands
  - name: Intake
  - name: Agents
  - name: Skills
  - name: ToolManifests
  - name: ToolProviders
  - name: ToolGroups
  - name: ServiceConnections
  - name: Runs
  - name: Approvals
  - name: Traces
  - name: Usage
  - name: Audit
  - name: ApiKeys
  - name: Members
  - name: Settings
  - name: Evals

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe for product API dependencies.
      security: []
      responses:
        "200":
          description: Product API is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Product API version.
      security: []
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get AgentOps dashboard overview.
      parameters:
        - name: environment
          in: query
          required: false
          schema:
            type: string
            example: production
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, 7d, 30d, month]
            default: today
      responses:
        "200":
          description: Dashboard overview data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /v1/search:
    get:
      tags: [Search]
      operationId: searchResources
      summary: Search agents, skills, tools, runs, and connections.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [agent, skill, tool, tool_provider, service_connection, run, approval, trace, audit]
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Search result list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List product notifications and alerts.
      parameters:
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Notification list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /v1/commands:
    post:
      tags: [Commands]
      operationId: dispatchCommand
      summary: Dispatch a product command.
      description: >
        Compatibility command endpoint for side-effectful product actions. New
        resource APIs should be preferred when a stable resource shape exists.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
            examples:
              runAgent:
                value:
                  command: agent.run
                  trace_id: trace_demo
                  payload:
                    agent_id: agent_crm
                    objective: Check customer ticket TIC-123.
      responses:
        "202":
          description: Command accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/intake/policies:
    get:
      tags: [Intake]
      operationId: listIntakePolicies
      summary: List intake pre-reply policies.
      responses:
        "200":
          description: Intake policy list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyListResponse"
    post:
      tags: [Intake]
      operationId: createIntakePolicy
      summary: Create an intake pre-reply policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakePolicy"
      responses:
        "201":
          description: Intake policy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyResponse"

  /v1/intake/policies/{policy_id}:
    parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Intake]
      operationId: getIntakePolicy
      summary: Get an intake pre-reply policy.
      responses:
        "200":
          description: Intake policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyResponse"
    put:
      tags: [Intake]
      operationId: updateIntakePolicy
      summary: Update an intake pre-reply policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakePolicy"
      responses:
        "200":
          description: Intake policy updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyResponse"
    delete:
      tags: [Intake]
      operationId: deleteIntakePolicy
      summary: Delete an intake pre-reply policy.
      responses:
        "200":
          description: Intake policy deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyDeleteResponse"

  /v1/intake/evaluate:
    post:
      tags: [Intake]
      operationId: evaluateIntakePreReply
      summary: Evaluate intake pre-reply policies.
      description: >
        Returns a deterministic pre-reply decision for the outer channel layer
        to dispatch. CleanCore does not send the channel message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeEvaluateRequest"
      responses:
        "200":
          description: Pre-reply decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeEvaluateResponse"

  /v1/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Agent list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreateRequest"
      responses:
        "201":
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/agents/import:
    post:
      tags: [Agents]
      operationId: importAgents
      summary: Import one or more agents from a package or manifest.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentImportRequest"
      responses:
        "202":
          description: Agent import accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agents/bulk-action:
    post:
      tags: [Agents]
      operationId: bulkActionAgents
      summary: Apply a bulk operation to agents.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBulkActionRequest"
      responses:
        "202":
          description: Bulk action accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get an agent.
      responses:
        "200":
          description: Agent resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Agents]
      operationId: patchAgent
      summary: Patch an agent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatchRequest"
      responses:
        "200":
          description: Agent patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Delete an agent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Agent deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{agent_id}/details:
    get:
      tags: [Agents]
      operationId: getAgentDetails
      summary: Get agent detail page data, including tabs and side panels.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, month]
            default: 7d
      responses:
        "200":
          description: Agent detail aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{agent_id}/publish:
    post:
      tags: [Agents]
      operationId: publishAgent
      summary: Publish an agent version.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPublishRequest"
      responses:
        "202":
          description: Publish accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/agents/{agent_id}/validate:
    post:
      tags: [Agents]
      operationId: validateAgent
      summary: Run publish-readiness checks for an agent draft.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationRequest"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationResponse"

  /v1/agents/{agent_id}/preview:
    post:
      tags: [Agents]
      operationId: previewAgent
      summary: Generate a preview response for an agent draft.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPreviewRequest"
      responses:
        "200":
          description: Preview response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPreviewResponse"

  /v1/agents/{agent_id}/versions:
    get:
      tags: [Agents]
      operationId: listAgentVersions
      summary: List agent release and draft versions.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent version list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersionListResponse"

  /v1/agents/{agent_id}/versions/{version}:
    get:
      tags: [Agents]
      operationId: getAgentVersion
      summary: Get an agent package version.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent package version.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/agents/{agent_id}/versions/{version}/activate:
    post:
      tags: [Agents]
      operationId: activateAgentVersion
      summary: Activate a stable agent package version as the default.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: version
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Agent package version activated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/agents/{agent_id}/versions/{version}/restore:
    post:
      tags: [Agents]
      operationId: restoreAgentVersion
      summary: Restore an old stable agent package version as the default.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: version
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: trace_id
          in: query
          required: false
          description: Optional trace id for the restore trace event. When omitted, the server generates one and returns it in meta.trace_id.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Stored in audit. Trace payload records only reason_present and reason_hash, not the raw reason text.
      responses:
        "200":
          description: Agent package version restored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  agent:
                    type: object
                    additionalProperties: true
                  version:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    additionalProperties: true
                    properties:
                      trace_id:
                        type: string

  /v1/agents/{agent_id}/collaborators:
    patch:
      tags: [Agents]
      operationId: patchAgentCollaborators
      summary: Update agent collaborators and access roles.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCollaboratorsPatchRequest"
      responses:
        "200":
          description: Agent collaborators updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailsResponse"

  /v1/skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List skill definitions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Skill list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
    post:
      tags: [Skills]
      operationId: createSkill
      summary: Create a skill definition.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpsertRequest"
      responses:
        "201":
          description: Skill created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"

  /v1/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      tags: [Skills]
      operationId: getSkill
      summary: Get a skill definition.
      responses:
        "200":
          description: Skill resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Skills]
      operationId: patchSkill
      summary: Patch a skill definition.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpsertRequest"
      responses:
        "200":
          description: Skill patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"
    delete:
      tags: [Skills]
      operationId: deleteSkill
      summary: Delete a skill definition.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Skill deleted.

  /v1/skills/{skill_id}/details:
    get:
      tags: [Skills]
      operationId: getSkillDetails
      summary: Get skill detail panel data, including schema, usage, versions, and changelog.
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200":
          description: Skill detail aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/skills/{skill_id}/run:
    post:
      tags: [Skills]
      operationId: runSkill
      summary: Run or test a skill directly.
      parameters:
        - $ref: "#/components/parameters/SkillId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRunRequest"
      responses:
        "202":
          description: Skill run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"

  /v1/tool-manifests:
    get:
      tags: [ToolManifests]
      operationId: listToolManifests
      summary: List tool manifests.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: provider_id
          in: query
          required: false
          schema:
            type: string
        - name: executor_type
          in: query
          required: false
          schema:
            type: string
            enum: [static_tool_host, agent_plugin_service, mcp, agent_tool, http_api_adapter, database_adapter]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, enabled, disabled]
        - name: risk_level
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, protected, exposed]
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tool manifest list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolManifestListResponse"
    post:
      tags: [ToolManifests]
      operationId: createToolManifest
      summary: Create or update a tool manifest.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolManifest"
      responses:
        "201":
          description: Tool manifest created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolManifestResponse"

  /v1/tool-manifests/{tool_id}:
    parameters:
      - $ref: "#/components/parameters/ToolId"
    get:
      tags: [ToolManifests]
      operationId: getToolManifest
      summary: Get a tool manifest.
      responses:
        "200":
          description: Tool manifest resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [ToolManifests]
      operationId: putToolManifest
      summary: Replace a tool manifest.
      description: Full replacement. Body tool_id, when supplied, must match the path tool_id.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolManifest"
      responses:
        "200":
          description: Tool manifest replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [ToolManifests]
      operationId: patchToolManifest
      summary: Patch a tool manifest.
      description: Partial update that preserves omitted fields. Body tool_id, when supplied, must match the path tool_id.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolManifestPatchRequest"
      responses:
        "200":
          description: Tool manifest patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [ToolManifests]
      operationId: disableToolManifest
      summary: Disable a tool manifest.
      responses:
        "200":
          description: Tool manifest disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolManifestResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tool-providers:
    get:
      tags: [ToolProviders]
      operationId: listToolProviders
      summary: List tool providers.
      description: Lists external tool sources by default. Set include_managed=true to include internal adapter providers such as managed_http_api_adapter and managed_database_adapter.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: provider_type
          in: query
          required: false
          schema:
            type: string
            enum: [static_tool_host, agent_plugin_service, mcp, http_api_adapter, database_adapter]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, enabled, disabled]
        - name: health_status
          in: query
          required: false
          schema:
            type: string
            enum: [unknown, healthy, unhealthy]
        - name: include_managed
          in: query
          required: false
          description: Include internal managed adapter providers. Defaults to false for tool source pages.
          schema:
            type: boolean
            default: false
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
        - name: cursor
