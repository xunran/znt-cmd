openapi: 3.0.3
info:
  title: Origin Agent Platform Product API
  version: v1.0-alpha
  description: >
    Product-level API contract for Origin Agent Platform. The product owns this
    contract; server-side services implement it; PloyKit modules consume it.

x-origin-contract:
  role: product-api-contract
  owner: origin-product
  consumers:
    - ploykit-origin-agentops
  implementedBy:
    - server-side-services
  sourceOfTruth: true

servers:
  - url: https://api.origin.example
    description: Production API endpoint.
  - url: http://127.0.0.1:8080
    description: Local implementation endpoint.
  - url: http://127.0.0.1:4010
    description: Local contract/mock endpoint.

security:
  - serviceToken: []
    originSignature: []
    originTimestamp: []
    originClaims: []

tags:
  - name: System
  - name: Dashboard
  - name: Search
  - name: Notifications
  - name: Commands
  - name: Intake
  - name: Agents
  - name: Skills
  - name: Tools
  - name: ToolProviders
  - name: ToolGroups
  - name: ServiceConnections
  - name: Runs
  - name: Approvals
  - name: Traces
  - name: Usage
  - name: Audit
  - name: ApiKeys
  - name: Members
  - name: Settings
  - name: Evals

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe for product API dependencies.
      security: []
      responses:
        "200":
          description: Product API is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Product API version.
      security: []
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get AgentOps dashboard overview.
      parameters:
        - name: environment
          in: query
          required: false
          schema:
            type: string
            example: production
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, 7d, 30d, month]
            default: today
      responses:
        "200":
          description: Dashboard overview data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /v1/search:
    get:
      tags: [Search]
      operationId: searchResources
      summary: Search agents, skills, tools, runs, and connections.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [agent, skill, tool, tool_provider, service_connection, run, approval, trace, audit]
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Search result list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List product notifications and alerts.
      parameters:
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Notification list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /v1/commands:
    post:
      tags: [Commands]
      operationId: dispatchCommand
      summary: Dispatch a product command.
      description: >
        Compatibility command endpoint for side-effectful product actions. New
        resource APIs should be preferred when a stable resource shape exists.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
            examples:
              runAgent:
                value:
                  command: agent.run
                  trace_id: trace_demo
                  payload:
                    agent_id: agent_crm
                    objective: Check customer ticket TIC-123.
      responses:
        "202":
          description: Command accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/intake/policies:
    get:
      tags: [Intake]
      operationId: listIntakePolicies
      summary: List intake pre-reply policies.
      responses:
        "200":
          description: Intake policy list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyListResponse"
    post:
      tags: [Intake]
      operationId: createIntakePolicy
      summary: Create an intake pre-reply policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakePolicy"
      responses:
        "201":
          description: Intake policy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyResponse"

  /v1/intake/policies/{policy_id}:
    parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Intake]
      operationId: getIntakePolicy
      summary: Get an intake pre-reply policy.
      responses:
        "200":
          description: Intake policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyResponse"
    put:
      tags: [Intake]
      operationId: updateIntakePolicy
      summary: Update an intake pre-reply policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakePolicy"
      responses:
        "200":
          description: Intake policy updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyResponse"
    delete:
      tags: [Intake]
      operationId: deleteIntakePolicy
      summary: Delete an intake pre-reply policy.
      responses:
        "200":
          description: Intake policy deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakePolicyDeleteResponse"

  /v1/intake/evaluate:
    post:
      tags: [Intake]
      operationId: evaluateIntakePreReply
      summary: Evaluate intake pre-reply policies.
      description: >
        Returns a deterministic pre-reply decision for the outer channel layer
        to dispatch. CleanCore does not send the channel message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeEvaluateRequest"
      responses:
        "200":
          description: Pre-reply decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeEvaluateResponse"

  /v1/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Agent list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreateRequest"
      responses:
        "201":
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/agents/import:
    post:
      tags: [Agents]
      operationId: importAgents
      summary: Import one or more agents from a package or manifest.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentImportRequest"
      responses:
        "202":
          description: Agent import accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agents/bulk-action:
    post:
      tags: [Agents]
      operationId: bulkActionAgents
      summary: Apply a bulk operation to agents.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBulkActionRequest"
      responses:
        "202":
          description: Bulk action accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get an agent.
      responses:
        "200":
          description: Agent resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Agents]
      operationId: patchAgent
      summary: Patch an agent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatchRequest"
      responses:
        "200":
          description: Agent patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Delete an agent.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Agent deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{agent_id}/details:
    get:
      tags: [Agents]
      operationId: getAgentDetails
      summary: Get agent detail page data, including tabs and side panels.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, month]
            default: 7d
      responses:
        "200":
          description: Agent detail aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agents/{agent_id}/publish:
    post:
      tags: [Agents]
      operationId: publishAgent
      summary: Publish an agent version.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPublishRequest"
      responses:
        "202":
          description: Publish accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/agents/{agent_id}/validate:
    post:
      tags: [Agents]
      operationId: validateAgent
      summary: Run publish-readiness checks for an agent draft.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationRequest"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationResponse"

  /v1/agents/{agent_id}/preview:
    post:
      tags: [Agents]
      operationId: previewAgent
      summary: Generate a preview response for an agent draft.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPreviewRequest"
      responses:
        "200":
          description: Preview response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPreviewResponse"

  /v1/agents/{agent_id}/versions:
    get:
      tags: [Agents]
      operationId: listAgentVersions
      summary: List agent release and draft versions.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent version list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersionListResponse"

  /v1/agents/{agent_id}/collaborators:
    patch:
      tags: [Agents]
      operationId: patchAgentCollaborators
      summary: Update agent collaborators and access roles.
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCollaboratorsPatchRequest"
      responses:
        "200":
          description: Agent collaborators updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailsResponse"

  /v1/skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List skill definitions.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Skill list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
    post:
      tags: [Skills]
      operationId: createSkill
      summary: Create a skill definition.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpsertRequest"
      responses:
        "201":
          description: Skill created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"

  /v1/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      tags: [Skills]
      operationId: getSkill
      summary: Get a skill definition.
      responses:
        "200":
          description: Skill resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Skills]
      operationId: patchSkill
      summary: Patch a skill definition.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpsertRequest"
      responses:
        "200":
          description: Skill patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"
    delete:
      tags: [Skills]
      operationId: deleteSkill
      summary: Delete a skill definition.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Skill deleted.

  /v1/skills/{skill_id}/details:
    get:
      tags: [Skills]
      operationId: getSkillDetails
      summary: Get skill detail panel data, including schema, usage, versions, and changelog.
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200":
          description: Skill detail aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/skills/{skill_id}/run:
    post:
      tags: [Skills]
      operationId: runSkill
      summary: Run or test a skill directly.
      parameters:
        - $ref: "#/components/parameters/SkillId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRunRequest"
      responses:
        "202":
          description: Skill run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"

  /v1/tools:
    get:
      tags: [Tools]
      operationId: listTools
      summary: List product tools.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: provider_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tool list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolListResponse"
    post:
      tags: [Tools]
      operationId: createTool
      summary: Register a product tool.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUpsertRequest"
      responses:
        "201":
          description: Tool created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"

  /v1/tools/{tool_id}:
    parameters:
      - $ref: "#/components/parameters/ToolId"
    get:
      tags: [Tools]
      operationId: getTool
      summary: Get a product tool.
      responses:
        "200":
          description: Tool resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"
    patch:
      tags: [Tools]
      operationId: patchTool
      summary: Patch a product tool.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolUpsertRequest"
      responses:
        "200":
          description: Tool patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"
    delete:
      tags: [Tools]
      operationId: deleteTool
      summary: Delete a product tool.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Tool deleted.

  /v1/tools/{tool_id}/details:
    get:
      tags: [Tools]
      operationId: getToolDetails
      summary: Get tool detail panel data, including schema, usage, agents, and versions.
      parameters:
        - $ref: "#/components/parameters/ToolId"
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, month]
            default: 7d
      responses:
        "200":
          description: Tool detail aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tools/{tool_id}/invoke:
    post:
      tags: [Tools]
      operationId: invokeTool
      summary: Invoke or smoke-test a product tool.
      parameters:
        - $ref: "#/components/parameters/ToolId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInvokeRequest"
      responses:
        "202":
          description: Tool invocation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInvokeResponse"

  /v1/tool-providers:
    get:
      tags: [ToolProviders]
      operationId: listToolProviders
      summary: List tool providers.
      responses:
        "200":
          description: Tool provider list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderListResponse"
    post:
      tags: [ToolProviders]
      operationId: createToolProvider
      summary: Create a tool provider.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolProviderUpsertRequest"
      responses:
        "201":
          description: Tool provider created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderResponse"

  /v1/tool-providers/{provider_id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      tags: [ToolProviders]
      operationId: getToolProvider
      summary: Get a tool provider.
      responses:
        "200":
          description: Tool provider resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderResponse"
    patch:
      tags: [ToolProviders]
      operationId: patchToolProvider
      summary: Patch a tool provider.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolProviderUpsertRequest"
      responses:
        "200":
          description: Tool provider patched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderResponse"
    delete:
      tags: [ToolProviders]
      operationId: deleteToolProvider
      summary: Delete a tool provider.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Tool provider deleted.

  /v1/tool-providers/{provider_id}/sync:
    post:
      tags: [ToolProviders]
      operationId: syncToolProvider
      summary: Synchronize a provider catalog.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Sync accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderResponse"

  /v1/tool-providers/{provider_id}/health-check:
    post:
      tags: [ToolProviders]
      operationId: checkToolProviderHealth
      summary: Run a live health check for a tool provider.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tool provider health check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderHealthResponse"

  /v1/tool-providers/{provider_id}/repair:
    post:
      tags: [ToolProviders]
      operationId: repairToolProvider
      summary: Attempt automatic repair for a degraded tool provider.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequest"
      responses:
        "202":
          description: Repair accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderResponse"

  /v1/tool-providers/{provider_id}/details:
    get:
      tags: [ToolProviders]
      operationId: getToolProviderDetails
      summary: Get tool provider detail panel data.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: Tool provider detail aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderDetailsResponse"

  /v1/tool-providers/{provider_id}/tools:
    get:
      tags: [ToolProviders]
      operationId: listToolProviderTools
      summary: List tools exposed by a tool provider.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
