components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
    originSignature:
      type: apiKey
      in: header
      name: x-origin-agentops-signature
    originTimestamp:
      type: apiKey
      in: header
      name: x-origin-agentops-timestamp
    originClaims:
      type: apiKey
      in: header
      name: x-origin-agentops-claims

  parameters:
    RequestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
    TraceId:
      name: x-trace-id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
    ToolId:
      name: tool_id
      in: path
      required: true
      schema:
        type: string
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
    TracePathId:
      name: trace_id
      in: path
      required: true
      schema:
        type: string
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
    EvalSetId:
      name: eval_set_id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid service authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated caller is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict, usually idempotency or state transition related.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Quota or rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Meta:
      type: object
      required: [request_id, trace_id]
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        workspace_id:
          type: string
        tenant_id:
          type: string
      additionalProperties: true

    ListMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            next_cursor:
              type: string
              nullable: true

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"

    HealthResponse:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [ok, ready, degraded, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string

    VersionResponse:
      type: object
      required: [version, contract_version]
      properties:
        version:
          type: string
        contract_version:
          type: string
        build:
          type: string

    ResourceRef:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string

    Agent:
      type: object
      required: [agent_id, name, status, created_at, updated_at]
      properties:
        agent_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, validating, review_required, published, disabled, archived]
        version:
          type: string
        identifier:
          type: string
          description: Human-friendly stable slug used in product UI.
        workspace_id:
          type: string
        version_policy:
          type: string
        prompt:
          type: string
        prompt_profile:
          type: object
          additionalProperties: true
        skill_ids:
          type: array
          description: Optional initial skill bindings; agent creation must be allowed without skills.
          items:
            type: string
        tool_ids:
          type: array
          description: Optional initial tool bindings; agent creation must be allowed without tools.
          items:
            type: string
        provider_ids:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        objectives:
          type: array
          items:
            type: string
        draft_version:
          type: string
          nullable: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_run_status:
          type: string
          nullable: true
        tool_count:
          type: integer
        run_count:
          type: integer
        eval_summary:
          type: object
          additionalProperties: true
        governance_summary:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        prompt:
          type: string
        identifier:
