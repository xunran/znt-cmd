services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clean_core
      POSTGRES_USER: clean_core
      POSTGRES_PASSWORD: clean_core_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clean_core -d clean_core"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - clean_core_pg:/var/lib/postgresql/data

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLEAN_CORE_DATABASE_URL: postgres://clean_core:clean_core_dev@postgres:5432/clean_core?sslmode=disable
    command: ["-migration", "up", "-migration-dir", "/migrations"]

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      CLEAN_CORE_ENV: local
      CLEAN_CORE_HTTP_ADDR: :8080
      CLEAN_CORE_SERVICE_TOKEN: dev-token
      CLEAN_CORE_DATABASE_URL: postgres://clean_core:clean_core_dev@postgres:5432/clean_core?sslmode=disable
      CLEAN_CORE_MODEL_PROVIDER: stub
      CLEAN_CORE_MODEL_MAX_TOKENS: 2048
      CLEAN_CORE_MODEL_TEMPERATURE: 0
    ports:
      - "8080:8080"

volumes:
  clean_core_pg:
